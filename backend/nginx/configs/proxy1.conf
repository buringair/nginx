upstream proxy2_backend {
    server cn-sso-config.lb.abc.com:443;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name sso-config.lb.abc.cn sso-logging.lb.abc.cn;

    access_log /home/uadmin/nginx/logs/proxy1_access.log;
    error_log /home/uadmin/nginx/logs/proxy1_error.log;

    ssl_certificate     /etc/nginx/certs/proxy1.crt;
    ssl_certificate_key /etc/nginx/certs/proxy1.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /config/1.2.1/ssoconf.xml {
        if ($request_method != GET) {
            return 405;
        }

        proxy_pass https://proxy2_backend/config/1.2.1/ssoconf.xml;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cn-sso-config.lb.abc.com;
        proxy_ssl_certificate /etc/nginx/certs/proxy1-client.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/proxy1-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_set_header Host cn-sso-config.lb.abc.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /sso/log {
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass https://proxy2_backend/sso/log;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cn-sso-config.lb.abc.com;
        proxy_ssl_certificate /etc/nginx/certs/proxy1-client.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/proxy1-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_set_header Host cn-sso-config.lb.abc.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
