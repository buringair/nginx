server {
    listen 443 ssl;
    http2 on;
    server_name sso-config.lb.abc.com;

    ssl_certificate     /etc/nginx/certs/sso-origin.crt;
    ssl_certificate_key /etc/nginx/certs/sso-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location = /config/1.2.1/ssoconf.xml {
        access_log /home/uadmin/nginx/logs/sso-config_get_access.log;

        if ($request_method != GET) {
            return 405;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sso-logging.lb.abc.com;

    ssl_certificate     /etc/nginx/certs/sso-origin.crt;
    ssl_certificate_key /etc/nginx/certs/sso-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location = /sso/log {
        access_log /home/uadmin/nginx/logs/sso-logging_post_access.log;

        if ($request_method != POST) {
            return 405;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
